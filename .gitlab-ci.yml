# Eve CI. Every merge must pass lint, typecheck, test and module boundaries (CLAUDE.md DoD).
# Images and npm packages come from public registries for now; point IMAGE_REGISTRY and .npmrc
# at the internal Harbor/Nexus mirror when available.

variables:
  IMAGE_REGISTRY: ''
  PNPM_STORE_DIR: .pnpm-store

default:
  image: ${IMAGE_REGISTRY}node:24.15.0-bookworm-slim
  before_script:
    - corepack enable pnpm
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

stages: [verify, e2e]

lint:
  stage: verify
  script:
    - pnpm lint
    - pnpm check:i18n

typecheck:
  stage: verify
  script:
    - pnpm typecheck

test:
  stage: verify
  services:
    - name: ${IMAGE_REGISTRY}pgvector/pgvector:0.8.1-pg17
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@postgres:5432/postgres
  script:
    - pnpm test
    - pnpm db:check-drift

boundaries:
  stage: verify
  script:
    - pnpm boundaries

e2e:
  stage: e2e
  image: ${IMAGE_REGISTRY}mcr.microsoft.com/playwright:v1.65.1-noble
  script:
    - pnpm e2e
  artifacts:
    when: on_failure
    paths: [apps/web/playwright-report/, apps/web/test-results/]
    expire_in: 1 week
