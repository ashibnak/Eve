<!doctype html>
<html dir="rtl">
<head><meta charset="utf-8"><title>ChartPanel</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"></head>
<body>
<div class="hr-stack"><section class="hr-chart" style="max-width:560px">
  <div><h3 class="hr-chart-title">فین‌تک تنها بخش زیر هدف است</h3><p class="hr-chart-sub">میانگین نسبت مقایسه به تفکیک بخش؛ خط‌چین = کف هدف ۰٫۹۵</p></div>
  <div class="hr-bars">
    <span class="hr-bar-ref" aria-hidden="true" style="right:calc(96px + (100% - 150px) * 0.5)"></span>
    <div class="hr-bar-row"><span class="hr-bar-label">ابر</span><div class="hr-bar-track"><div class="hr-bar-fill" style="width:60%"></div></div><span class="hr-bar-value">۰٫۹۸</span></div>
    <div class="hr-bar-row"><span class="hr-bar-label">فین‌تک</span><div class="hr-bar-track"><div class="hr-bar-fill is-bad" style="width:27%"></div></div><span class="hr-bar-value hr-bad">۰٫۸۸</span></div>
    <div class="hr-bar-row"><span class="hr-bar-label">محصولات</span><div class="hr-bar-track"><div class="hr-bar-fill" style="width:53%"></div></div><span class="hr-bar-value">۰٫۹۶</span></div>
    <div class="hr-bar-row"><span class="hr-bar-label">سرمایه‌گذاری</span><div class="hr-bar-track"><div class="hr-bar-fill" style="width:73%"></div></div><span class="hr-bar-value">۱٫۰۲</span></div>
  </div>
  <div class="hr-axis" style="padding-inline-start:96px;padding-inline-end:54px"><span>۰٫۸۰</span><span>۰٫۹۵</span><span>۱٫۱۰</span></div>
</section></div>
</body>
</html>
